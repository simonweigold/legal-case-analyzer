# Nginx configuration to serve ONLY the landing page and its static assets
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security & basic headers
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy no-referrer-when-downgrade;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self';";

  # Exact root path: serve landing page only
  location = / {
    try_files /index.html =404;
  }

  # Static build assets (hashed files)
  location /assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public,max-age=31536000,immutable";
  }

  # Allow only explicitly referenced root-level files (icons, manifest, video)
  location ~ ^/(favicon.ico|favicon-16x16.png|favicon-32x32.png|apple-touch-icon.png|site.webmanifest|demo.mov)$ {
    try_files $uri =404;
  }

  # Block any other route attempts (e.g. /clerk, /api)
  location / {
    return 404;
  }

  # Deny hidden files
  location ~ /\. { deny all; }

  # Optional: allow source maps but don't index
  location ~* \.map$ {
    add_header Cache-Control "public,max-age=604800";
  }
}
